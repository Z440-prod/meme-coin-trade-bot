# =============================================================================
#  MCTB main configuration
#
#    cp config/config.example.yaml config/config.yaml
#
#  This file is merged ON TOP OF the strategy preset named below, so anything
#  you set here wins. Secrets do NOT go here — they live in .env.
#
#  Copy the SAME config.yaml to all three devices. Each process only reads the
#  sections it needs, and `role` is set per-device on the command line.
# =============================================================================

# Which tuning preset to start from: conservative | balanced | degen
# Presets live in config/strategies/. Start with conservative.
strategy_preset: balanced

log_level: INFO

# --- Execution ---------------------------------------------------------------
execution:
  # "paper" simulates every fill against live prices and risks nothing.
  # Leave it here until your paper numbers are good over at least 100 trades.
  mode: paper

  # THE SECOND SAFETY LATCH. Real money requires mode: live AND this true.
  # Two switches means one careless edit cannot arm your wallet.
  live_trading_enabled: false

  buy_slippage_pct: 15.0
  sell_slippage_pct: 25.0
  priority_fee_sol: 0.0008
  exit_priority_fee_sol: 0.002
  pool: auto

  # Paper-mode realism. Do not set these to zero — a backtest with no fees or
  # slippage will tell you a losing strategy is profitable.
  paper_latency_ms: 400
  paper_slippage_pct: 4.0
  paper_fee_pct: 1.0
  paper_starting_bankroll_sol: 1.0

# --- Risk --------------------------------------------------------------------
# Read docs/SAFETY.md before raising any of these.
risk:
  max_position_sol: 0.05
  position_pct_of_bankroll: 0.02
  min_sol_reserve: 0.05
  max_concurrent_positions: 3
  max_positions_per_hour: 12
  max_sol_deployed_per_hour: 0.4
  daily_loss_limit_sol: 0.25
  consecutive_loss_limit: 5
  cooldown_after_halt_s: 3600
  same_mint_cooldown_s: 3600
  kill_switch_file: ./KILL_SWITCH

# --- Solana RPC --------------------------------------------------------------
# URLs come from .env. Only behavioural settings live here.
rpc:
  timeout_s: 10.0
  max_retries: 3
  read_commitment: confirmed
  price_commitment: processed

# --- Copy trading ------------------------------------------------------------
wallets:
  enabled: true

  # Wallets you already trust. These start with maximum weight.
  # Find candidates on gmgn.ai / dexscreener / solscan, or let auto_discover
  # build the list for you over a few days of running in paper mode.
  seed_wallets: []
  #  - "AArPXm8JatJiuyEffuC1un2Sc835SULa4uQqDcaGpAjV"

  auto_discover: true
  discovery_min_wins: 3
  discovery_win_multiple: 3.0
  discovery_max_entry_sol: 20.0
  max_tracked_wallets: 150
  # Metered PumpPortal subscriptions cost SOL. Cap what we subscribe to.
  max_subscribed_wallets: 40

# --- Social ------------------------------------------------------------------
# Entirely optional. Without an X token the bot works fine, just without the
# social feature. Do not pay for an X plan until you are actually profitable.
social:
  enabled: false
  x_accounts: []
  x_queries:
    - "pump.fun"
  poll_interval_s: 30
  mention_ttl_s: 900
  min_followers: 5000

# --- Local LLM ---------------------------------------------------------------
llm:
  enabled: true
  model: local
  # The LLM is ADVISORY and off the hot path. If it is slow we trade without
  # it. Never raise this above ~8s or you will miss every entry.
  timeout_s: 6.0
  max_tokens: 400
  temperature: 0.2
  # Only consult it for candidates that already scored this well.
  min_score_to_consult: 55.0
  # It can veto hard but it cannot manufacture conviction.
  max_bonus: 12.0
  max_penalty: 40.0
  nightly_review: true
  nightly_review_hour_utc: 4
  # Leave false. Read the nightly report yourself before changing parameters.
  auto_apply_tuning: false

# --- Console (host PC) -------------------------------------------------------
console:
  host: 0.0.0.0
  port: 8787
  auto_open_browser: true
  browser_url_template: "https://pump.fun/coin/{mint}"
  brain_heartbeat_timeout_s: 20
  # Backstop only — deliberately wider than the Brain's own stop, so it fires
  # only when the Brain has actually failed.
  supervisor_enabled: true
  supervisor_stop_loss_pct: 0.50
  desktop_notifications: true
  telegram_alerts: false

# --- External data providers -------------------------------------------------
# API keys come from .env, never from here. This section is behaviour only.
providers:
  # Restrict to a subset. Empty = every provider that has what it needs.
  enabled: []
  # Never use these, even if a key exists.
  disabled: []

  # GMGN publishes no official API. These are undocumented internal endpoints
  # behind bot protection: they can break or block without notice. Off by
  # default; read docs/PROVIDERS.md before enabling.
  gmgn_opt_in: false

  # DEXTools encodes the plan in the URL path.
  dextools_plan: trial

  # Latency budgets. The WARM budget is the only one on a decision path —
  # raising it makes you slower to enter, not smarter.
  warm_timeout_s: 0.4
  cold_timeout_s: 3.0
  # Background enrichment workers. 3 keeps a Pi comfortable.
  enrich_workers: 3

# --- Intelligence fusion -----------------------------------------------------
intel:
  enabled: true

  # Entity resolution: collapse wallets that are really one actor before
  # counting them as independent confirmations. The single highest-value
  # setting in this file — it removes a whole class of manufactured signal.
  entity_resolution: true
  # Funding lineage needs a Helius key. Without one the graph still clusters
  # from co-buying behaviour, just less precisely.
  resolve_funding: true
  funding_resolve_interval_s: 120
  funding_resolve_batch: 20

  # Reject when this share of apparent consensus is one clustered entity.
  max_sybil_ratio: 0.5
  # Reject when this share of buyers are wallets created in the last 24h.
  max_fresh_wallet_ratio: 0.75
  # Reject when this share of buyers look like deployer insiders.
  max_insider_ratio: 0.25

  # Reject when volume looks manufactured (see fusion.py for the heuristic).
  max_wash_suspicion: 0.7
  # Reject when a round trip would cost more than this. On a thin token this
  # routinely exceeds 20%, meaning the trade needs a 20% move to break even.
  max_round_trip_cost_pct: 25.0
  # Require a live sell route before buying. Catches honeypots that pass every
  # contract check — leave this on.
  require_sellable: true

  # Above this score, social evidence counts AGAINST a token.
  astroturf_threshold: 0.5
  narrative_ttl_s: 1800

  # How far fused intel may move a score. Bounded like every other adjustment.
  max_intel_bonus: 12.0
  max_intel_penalty: 35.0

# --- Outbound alerts ---------------------------------------------------------
alerts:
  enabled: true
  # Enabled automatically when the matching keys are present in .env.
  telegram: false
  discord: false
  # Generic JSON POST targets — Zapier catch hooks, n8n webhook nodes, etc.
  webhooks: []

  on_entry: true
  on_exit: true
  on_big_win: true
  on_big_loss: true
  on_halt: true
  on_provider_failure: true
  big_move_pct: 0.5

  min_interval_s: 1.0
  dedupe_window_s: 60

# --- Inbound webhooks (TradingView / Zapier / n8n) ---------------------------
webhooks:
  enabled: false
  # Set MCTB_WEBHOOK_SECRET in .env. It is both the URL path and the HMAC key.
  secret: ""
  # Whether an inbound message may open or close positions.
  # OFF by default. Anything that can move money should be a deliberate choice,
  # and enabling this without a secret is refused at startup.
  allow_trading: false
  # Whether it may engage the kill switch. Safe to leave on — it only stops.
  allow_kill: true
  max_age_s: 300
  # Restrict source IPs. TradingView publishes its ranges; leave empty for any.
  allowed_ips: []

# --- Runtime tuning ----------------------------------------------------------
# uvloop is a 2-4x faster event loop, installed with: pip install uvloop
use_uvloop: true
tune_gc: true

paths:
  data_dir: ./data
  log_dir: ./logs
  db_file: ./data/mctb.db
  keystore_path: ./secrets/trading.keystore
